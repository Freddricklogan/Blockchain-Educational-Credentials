name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution:
    name: Attribution check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No tool attribution in the tree or the history
        run: |
          set -e
          if git grep -iIE 'claude|\banthropic|co-authored-by|generated with|noreply@anthropic' -- . ':!*.lock' ':!**/vendor/**' ':!**/node_modules/**' ':!.github/workflows/*'; then
            echo "::error::tool attribution found in tracked files"; exit 1; fi
          if git log --all --format='%an <%ae>%n%cn <%ce>%n%B' | grep -iE 'claude|\banthropic|co-authored-by|generated with|noreply@anthropic'; then
            echo "::error::tool attribution found in commit history"; exit 1; fi
          for f in CLAUDE.md AGENTS.md .cursorrules .claude .cursor .github/copilot-instructions.md; do
            [ -e "$f" ] && { echo "::error::$f must not be committed"; exit 1; }; done
          echo "attribution check: clean"

  lint:
    name: Lint (internal Markdown links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check   # stdlib-only script; the runner's python3 is enough

  link-check:
    name: Link check (advisory)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 4 --accept 200,206,429,999
            --exclude 'github.com/${{ github.repository }}/actions'
            README.md docs/CASE_STUDY.md AUDIT.md
          fail: true
